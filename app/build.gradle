plugins { id 'com.android.application' }

android {
    namespace 'tv.sachin.streamshelf'
    compileSdk 35
    defaultConfig {
        applicationId 'tv.sachin.streamshelf'
        minSdk 24
        targetSdk 34
        // 16 / 1.6.0: Live TV auto-skips dead channels, shelves centre focused
        // cards smoothly, hardware layers are transient, and the app now has a
        // branded splash + animated loading states.
        // 17 / 1.6.1: HTTPS fallback so playlists with expired, self-signed or
        // incomplete provider certificates load instead of failing. Normal
        // platform validation is still tried first.
        // 18 / 1.6.2: Smaller cards on TV and whole-card shelf scrolling so the
        // first card is no longer cropped when switching sections.
        // 19 / 1.6.3: Fire TV 1280x720 app tile, bundled Roboto, smaller group
        // titles, and a lower player control bar that is fully remote-navigable.
        // 20 / 1.6.4: Live TV Up/Down always changes channel while the video is
        // focused, including when the controls are visible.
        // 21 / 1.6.5: My List keeps a saved snapshot so titles survive playlist
        // URL rotation, and the player's quality placeholder is replaced by
        // working multi-track audio selection.
        // 22 / 1.6.6: Saving to My List no longer rebuilds the whole screen (it
        // repaints the heart and only rebuilds My List/Series), favourite keys
        // are cached, and any error while saving or drawing is caught, logged
        // and shown inline instead of closing the app. Section dividers now
        // keep their 1dp height, so a short My List no longer collapses into a
        // blank screen after removing a title.
        // 23 / 1.6.6: same code, new versionCode. Android caches a package's
        // launcher icon per (package, version), so phones and Fire TV that
        // already installed 1.6.6 would keep showing the old, stretched banner
        // icon after updating. A new versionCode forces the icon cache to be
        // rebuilt, and the app now ships a real square launcher icon.
        versionCode 23
        versionName '1.6.6'
    }

    /**
     * One signing key for every build, checked into the repo.
     *
     * A debug build normally gets a keystore generated on whichever machine
     * built it, so every CI run produces an APK with a different signature and
     * `adb install -r` fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE. The only
     * way to update then is to uninstall first — which wipes the saved
     * playlists, My List and watch progress. This is a personal sideloaded app
     * with nothing to protect here, so a shared key is the practical choice: an
     * update keeps the user's data.
     */
    signingConfigs {
        shared {
            storeFile file('../keystore/streamshelf-debug.jks')
            storePassword 'streamshelf'
            keyAlias 'streamshelf'
            keyPassword 'streamshelf'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.shared
        }
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.6.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.6.1'
    implementation 'androidx.media3:media3-ui:1.6.1'
    implementation 'androidx.media3:media3-common:1.6.1'
    implementation 'androidx.core:core:1.12.0'
}

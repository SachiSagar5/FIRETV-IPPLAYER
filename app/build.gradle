plugins { id 'com.android.application' }

android {
    namespace 'tv.sachin.streamshelf'
    compileSdk 35
    defaultConfig {
        applicationId 'tv.sachin.streamshelf'
        minSdk 24
        targetSdk 34
        // 16 / 1.6.0: Live TV auto-skips dead channels, shelves centre focused
        // cards smoothly, hardware layers are transient, and the app now has a
        // branded splash + animated loading states.
        versionCode 16
        versionName '1.6.0'
    }

    /**
     * One signing key for every build, checked into the repo.
     *
     * A debug build normally gets a keystore generated on whichever machine
     * built it, so every CI run produces an APK with a different signature and
     * `adb install -r` fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE. The only
     * way to update then is to uninstall first — which wipes the saved
     * playlists, My List and watch progress. This is a personal sideloaded app
     * with nothing to protect here, so a shared key is the practical choice: an
     * update keeps the user's data.
     */
    signingConfigs {
        shared {
            storeFile file('../keystore/streamshelf-debug.jks')
            storePassword 'streamshelf'
            keyAlias 'streamshelf'
            keyPassword 'streamshelf'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.shared
        }
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.6.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.6.1'
    implementation 'androidx.media3:media3-ui:1.6.1'
    implementation 'androidx.media3:media3-common:1.6.1'
    implementation 'androidx.core:core:1.12.0'
}
